aid: celus
name: Celus
description: >-
  CELUS GmbH is a Munich-based electronics design automation company building an
  AI-driven, cloud design platform that automates the early stages of printed
  circuit board (PCB) engineering. The CELUS Design Platform turns high-level
  product requirements into schematics, part selections and layout-ready outputs
  in minutes rather than days by combining AI-powered component search with its
  proprietary CUBO component knowledge base, then handing off EDA-compatible
  files to tools like Altium and KiCad. Founded by Alexander and Tobias Pohl and
  backed by Earlybird and Speedinvest, CELUS targets hardware engineers and
  manufacturers pursuing digital transformation of the electronics design
  workflow. The platform is a closed SaaS product accessed through app.celus.io;
  as of this enrichment pass CELUS publishes no public developer API, OpenAPI
  specification, or developer portal.
